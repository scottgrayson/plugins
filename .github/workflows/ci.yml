name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brand-ban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if forbidden brand whole-word appears
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep >/dev/null
          # Split so this workflow file itself does not contain the needle.
          needle="t""app"
          if rg -n -i --glob '!.git/**' "\\b${needle}\\b" .; then
            echo "Forbidden whole-word brand match (case-insensitive)." >&2
            exit 1
          fi
          echo "OK: no forbidden brand whole-word matches"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep curl zsh python3-pip >/dev/null
          # mikefarah yq (workflow YAML assertions in run-tests.sh)
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # Offline o200k tokenizer (ranks vendored under plugins/ai-audit/vendor/).
          # Pin + hash-check the tiktoken wheel (round-18 D5); deps install normally.
          python3 -m pip download --dest /tmp/tiktoken-whl --no-deps -q 'tiktoken==0.14.0'
          EXPECTED_TIKTOKEN_SHA256=7896eea257fe497a2b7134474d909156c6744ce8da35bce88011a960e008aa0d
          GOT="$(sha256sum /tmp/tiktoken-whl/tiktoken-*.whl | awk '{print $1}')"
          test "$GOT" = "$EXPECTED_TIKTOKEN_SHA256"
          python3 -m pip install --user -q /tmp/tiktoken-whl/tiktoken-*.whl
          # Vendored ranks integrity (must match vendor/README.md)
          echo '446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  plugins/ai-audit/vendor/o200k_base.tiktoken' \
            | sha256sum -c -
      - name: Run unit tests (preview + ai-audit)
        run: bash dev/run-tests.sh

  e2e-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install e2e dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # curl/python3 are used by run-e2e-agent.sh; ripgrep kept available for
          # any follow-on greps. yq matches the tests job toolchain for local parity.
          sudo apt-get install -y -qq ripgrep curl python3 >/dev/null
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run agent-mode e2e
        run: bash dev/run-e2e-agent.sh
