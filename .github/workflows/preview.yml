name: Preview

on:
  pull_request:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ensure-checkbox:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./plugins/preview
        with:
          mode: ensure-checkbox
          pr-number: ${{ github.event.pull_request.number }}

  preview:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'edited') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/preview start'))
    runs-on: ubuntu-latest
    timeout-minutes: 130
    concurrency:
      group: preview-${{ github.repository }}-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          echo "job_start=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "force_start=yes" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "force_start=no" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        id: avg-cache
        with:
          path: .preview-metrics
          key: preview-avg-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            preview-avg-${{ github.repository }}-

      # No full checkout: pull only the three tiny lib scripts from the PR head.
      - name: Gate and mark loading
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          FORCE_START: ${{ steps.pr.outputs.force_start }}
          PREVIEW_METRICS_DIR: ${{ github.workspace }}/.preview-metrics
        run: |
          set -euo pipefail
          mkdir -p /tmp/preview-lib "$PREVIEW_METRICS_DIR"
          for f in common.sh pr_description.sh actions_pr.sh; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/plugins/preview/lib/${f}?ref=${HEAD_SHA}" --jq .content \
              | base64 -d >"/tmp/preview-lib/$f"
          done
          # shellcheck source=/dev/null
          source /tmp/preview-lib/actions_pr.sh

          if [[ "$FORCE_START" == "yes" ]]; then
            should=yes
          else
            should="$(preview_actions_should_start)"
          fi
          echo "start=$should" >> "$GITHUB_OUTPUT"
          avg="$(preview_actions_read_avg_seconds)"
          echo "avg_seconds=$avg" >> "$GITHUB_OUTPUT"
          if [[ "$should" != "yes" ]]; then
            echo "Skipping preview (control line is not newly ticked)."
            exit 0
          fi
          preview_actions_mark_loading "$avg"

      - uses: actions/checkout@v4
        if: steps.decide.outputs.start == 'yes'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Checkout PR head for comment trigger
        if: steps.decide.outputs.start == 'yes' && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout "${{ steps.pr.outputs.number }}"

      - name: Collect labels
        if: steps.decide.outputs.start == 'yes'
        id: labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="$(gh api "repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/labels" --jq '[.[].name]|join(",")')"
          echo "csv=$labels" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.decide.outputs.start == 'yes'
        with:
          path: |
            examples/hello-world/.npm
            ~/.cache/pip
          key: preview-deps-${{ runner.os }}-${{ hashFiles('examples/hello-world/**') }}

      - uses: ./plugins/preview
        if: steps.decide.outputs.start == 'yes'
        with:
          mode: run
          working-directory: examples/hello-world
          config: .preview.json
          labels: ${{ steps.labels.outputs.csv }}
          pr-number: ${{ steps.pr.outputs.number }}
          metrics-dir: ${{ github.workspace }}/.preview-metrics
          job-start-epoch: ${{ steps.pr.outputs.job_start }}

      - name: Reset idle on early failure
        if: failure() && steps.decide.outputs.start == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /tmp/preview-lib/actions_pr.sh
          preview_actions_mark_stopped "failure"
          echo "[preview] stop reason: failure" >&2
