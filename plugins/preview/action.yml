name: Preview
description: Spin up a temporary Cloudflare quick-tunnel preview for a repo app
inputs:
  working-directory:
    description: Directory containing .preview/config.json
    required: false
    default: .
  config:
    description: Path to .preview/config.json (relative to working-directory)
    required: false
    default: .preview/config.json
  labels:
    description: Comma-separated PR labels (preview:<step> selection)
    required: false
    default: ''
  pr-number:
    description: Pull request number when running in Actions mode
    required: false
    default: ''
  mode:
    description: ensure-checkbox | run
    required: false
    default: run
  job-start-epoch:
    description: Epoch seconds when the deploy started (for READY timing + created ET)
    required: false
    default: ''
  created-et:
    description: Preformatted America/New_York created timestamp with ET label
    required: false
    default: ''
  skip-idle-reset:
    description: If true, leave Idle reset to the finalize job (for live UI updates)
    required: false
    default: 'false'
outputs:
  stop_reason:
    description: Why the preview stopped
    value: ${{ steps.run.outputs.stop_reason }}
runs:
  using: composite
  steps:
    - name: Ensure checkbox
      if: inputs.mode == 'ensure-checkbox'
      shell: bash
      env:
        PREVIEW_PR_NUMBER: ${{ inputs.pr-number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        PLUGIN_ROOT="${{ github.action_path }}"
        # shellcheck source=/dev/null
        source "$PLUGIN_ROOT/lib/actions_pr.sh"
        preview_actions_ensure_checkbox

    - name: Install tools
      if: inputs.mode == 'run'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq curl jq python3 ca-certificates >/dev/null

    - name: Run preview
      if: inputs.mode == 'run'
      id: run
      shell: bash
      env:
        PREVIEW_PR_NUMBER: ${{ inputs.pr-number }}
        PREVIEW_BRANCH: ${{ github.head_ref }}
        PREVIEW_LABELS: ${{ inputs.labels }}
        PREVIEW_WORKDIR: ${{ inputs.working-directory }}
        PREVIEW_CONFIG_INPUT: ${{ inputs.config }}
        PREVIEW_JOB_START_EPOCH: ${{ inputs.job-start-epoch }}
        PREVIEW_CREATED_ET: ${{ inputs.created-et }}
        PREVIEW_SKIP_IDLE_RESET: ${{ inputs.skip-idle-reset }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        PLUGIN_ROOT="${{ github.action_path }}"
        chmod +x "$PLUGIN_ROOT/bin/preview"
        WORKDIR="${{ github.workspace }}/${PREVIEW_WORKDIR}"
        cd "$WORKDIR"
        export PREVIEW_STATE_DIR="$WORKDIR/.preview/run"
        mkdir -p "$PREVIEW_STATE_DIR"
        # shellcheck source=/dev/null
        source "$PLUGIN_ROOT/lib/actions_pr.sh"
        # shellcheck source=/dev/null
        source "$PLUGIN_ROOT/lib/config.sh"

        labels="${PREVIEW_LABELS:-}"
        config="$PREVIEW_CONFIG_INPUT"
        job_start="${PREVIEW_JOB_START_EPOCH:-$(date +%s)}"
        created_et="${PREVIEW_CREATED_ET:-}"
        if [[ -z "$created_et" ]]; then
          created_et="$(preview_pr_format_et "$job_start")"
        fi

        cleanup() {
          local reason
          reason="$(cat "$PREVIEW_STATE_DIR/reason" 2>/dev/null || echo cancelled)"
          echo "stop_reason=$reason" >> "$GITHUB_OUTPUT"
          "$PLUGIN_ROOT/bin/preview" stop "$reason" >/dev/null 2>&1 || true
          echo "[preview] stop reason: $reason" >&2
          # Idle body reset is owned by the short finalize job when skip-idle-reset=true,
          # so the open PR page gets a live update (same pattern as mark-loading).
          if [[ "${PREVIEW_SKIP_IDLE_RESET}" != "true" && -n "${PREVIEW_PR_NUMBER:-}" ]]; then
            preview_actions_mark_stopped "$reason" || true
          fi
        }
        trap cleanup EXIT

        preview_load_config "$config"
        idle_seconds="${PREVIEW_IDLE_SECONDS:-300}"

        LOG_DIR="$(mktemp -d)"
        setsid "$PLUGIN_ROOT/bin/preview" up --config "$config" --labels "$labels" >"$LOG_DIR/up.stdout" 2>"$LOG_DIR/up.stderr" &
        UP_PID=$!
        echo "$UP_PID" >"$PREVIEW_STATE_DIR/up_pid"

        url=""
        for i in $(seq 1 120); do
          if [[ -f "$PREVIEW_STATE_DIR/status" ]]; then
            st="$(cat "$PREVIEW_STATE_DIR/status")"
            if [[ "$st" == "watching" || "$st" == "ready" ]]; then
              url="$(cat "$PREVIEW_STATE_DIR/url")"
              break
            fi
          fi
          if ! kill -0 "$UP_PID" 2>/dev/null; then
            echo "preview up exited early:" >&2
            cat "$LOG_DIR/up.stderr" >&2 || true
            exit 1
          fi
          sleep 1
        done
        if [[ -z "$url" ]]; then
          echo "timed out waiting for READY" >&2
          echo "--- up.stderr ---" >&2
          cat "$LOG_DIR/up.stderr" >&2 || true
          exit 1
        fi
        mkdir -p "$PREVIEW_STATE_DIR"
        cp "$LOG_DIR/up.stdout" "$PREVIEW_STATE_DIR/up.stdout" 2>/dev/null || true
        cp "$LOG_DIR/up.stderr" "$PREVIEW_STATE_DIR/up.stderr" 2>/dev/null || true

        ready_at="$(date +%s)"
        elapsed=$((ready_at - job_start))
        if (( elapsed < 1 )); then elapsed=1; fi

        if [[ -n "${PREVIEW_PR_NUMBER:-}" ]]; then
          preview_actions_mark_ready "$url" "$job_start" "$idle_seconds" "$elapsed"
        fi

        wait "$UP_PID" || true
        trap - EXIT
        reason="$(cat "$PREVIEW_STATE_DIR/reason" 2>/dev/null || echo stopped)"
        echo "stop_reason=$reason" >> "$GITHUB_OUTPUT"
        echo "[preview] stop reason: $reason" >&2
        if [[ "${PREVIEW_SKIP_IDLE_RESET}" != "true" && -n "${PREVIEW_PR_NUMBER:-}" ]]; then
          preview_actions_mark_stopped "$reason"
        fi
